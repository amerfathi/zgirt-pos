name: ZGIRT CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Security Regression Tests
        run: npm run test:security

      - name: Accounting & Consistency Tests
        run: npm run test:accounting

      - name: Causal Sync & Conflict Tests
        run: node --test tests/conflict-review-ui.test.mjs tests/sync-durable.test.mjs tests/cash-shift-engine.test.mjs tests/cash-movement.test.mjs

      - name: Tenant & Branch Isolation Tests
        run: node --test tests/branch-isolation.test.mjs tests/branch-store.test.mjs

      - name: Verify Web Production Bundle
        run: npm run build
